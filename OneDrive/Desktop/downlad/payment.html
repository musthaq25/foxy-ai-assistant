<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DayStack | Secure Payment Gateway</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    :root {
      --bg: #050508;
      --surface: #0E0E14;
      --border: rgba(255, 255, 255, 0.08);
      --border-gold: rgba(197, 160, 89, 0.3);
      --primary: #C5A059;
      --primary-hover: #E2BC72;
      --text: #F4F4F6;
      --text-muted: #9A9AA6;
      --success: #10B981;
      --error: #EF4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Dual Radial Glows */
    .glow-gold {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(197, 160, 89, 0.15) 0%, transparent 70%);
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
      filter: blur(40px);
    }
    .glow-violet {
      position: absolute;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.12) 0%, transparent 70%);
      bottom: 20%;
      left: 50%;
      transform: translate(-50%, 0);
      pointer-events: none;
      z-index: 1;
      filter: blur(50px);
    }

    .checkout-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 450px;
      background: rgba(14, 14, 20, 0.85);
      border: 1px solid var(--border-gold);
      border-radius: 28px;
      padding: 40px 32px 32px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(197, 160, 89, 0.1);
      text-align: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      animation: cardSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardSlideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(197, 160, 89, 0.1);
      border: 1px solid var(--border-gold);
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .logo-container {
      margin-bottom: 20px;
    }

    .logo-img {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      border: 1px solid var(--border-gold);
      background: rgba(255, 255, 255, 0.03);
      padding: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    h2 {
      font-size: 1.65rem;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #FFFFFF 0%, #E2E8F0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .details-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 28px;
      text-align: left;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-size: 0.95rem;
    }

    .detail-row:last-child {
      margin-bottom: 0;
      padding-top: 14px;
      border-top: 1px dashed var(--border);
    }

    .detail-label {
      color: var(--text-muted);
      font-weight: 500;
    }

    .detail-value {
      font-weight: 600;
      color: var(--text);
    }

    .detail-value.price {
      background: linear-gradient(135deg, #FDE68A 0%, #C5A059 50%, #D97706 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 1.35rem;
      font-weight: 800;
    }

    .status-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 20px 0;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(197, 160, 89, 0.15);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .status-text {
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1.5;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: linear-gradient(135deg, #C5A059 0%, #E2BC72 100%);
      color: #030307;
      border: none;
      border-radius: 16px;
      padding: 16px 24px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s ease;
      margin-top: 16px;
      box-shadow: 0 10px 25px rgba(197, 160, 89, 0.25);
    }

    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(197, 160, 89, 0.4);
    }

    .trust-footer {
      margin-top: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }
    .trust-item { display: flex; align-items: center; gap: 4px; }
  </style>
</head>
<body>
  <div class="glow-gold"></div>
  <div class="glow-violet"></div>

  <div class="checkout-card">
    <div class="security-badge">
      <span>🔒</span> 256-bit Encrypted SSL Gateway
    </div>

    <div class="logo-container">
      <img src="./logo.png" alt="DayStack Logo" class="logo-img" onerror="this.src='https://daystack-mu.vercel.app/logo.png'">
    </div>
    <h2 id="checkout-title">DayStack Payment</h2>
    <p class="subtitle" id="checkout-subtitle">Authenticating secure payment session...</p>

    <div class="details-box" id="details-box" style="display: none;">
      <div class="detail-row">
        <span class="detail-label">Account</span>
        <span class="detail-value" id="user-email">-</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Plan</span>
        <span class="detail-value" id="plan-name">-</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Amount</span>
        <span class="detail-value price" id="plan-price">-</span>
      </div>
    </div>

    <div class="status-container" id="status-container">
      <div class="spinner" id="spinner"></div>
      <p class="status-text" id="status-text">Connecting to secure gateway...</p>
    </div>

    <div id="action-buttons" style="display: none;">
      <a href="daystack://payment-failed" class="btn-action" id="btn-redirect">Return to DayStack App</a>
    </div>

    <div class="trust-footer">
      <div class="trust-item">⚡ Instant Activation</div>
      <span>•</span>
      <div class="trust-item">🛡️ Razorpay Verified</div>
      <span>•</span>
      <div class="trust-item">🔒 PCI-DSS Compliant</div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('session');

    function updateStatus(type, message) {
      const spinner = document.getElementById('spinner');
      const text = document.getElementById('status-text');
      if (type === 'loading') {
        spinner.style.display = 'block';
      } else {
        spinner.style.display = 'none';
        text.style.color = type === 'success' ? 'var(--success)' : 'var(--error)';
      }
      text.textContent = message;
    }

    function showButtons(schemeUrl, text = "Return to DayStack App") {
      document.getElementById('action-buttons').style.display = 'block';
      const btn = document.getElementById('btn-redirect');
      btn.href = schemeUrl;
      btn.textContent = text;
    }

    window.onload = startCheckoutFlow;

    async function startCheckoutFlow() {
      if (!sessionId) {
        document.getElementById('checkout-title').textContent = "Payment Session Required";
        document.getElementById('checkout-subtitle').textContent = "Please initiate your upgrade directly from the DayStack App.";
        updateStatus('error', 'No valid session ID provided. Tokens and price overrides are strictly prohibited in browser URLs.');
        showButtons("daystack://payment-failed", "Return to DayStack App");
        return;
      }

      try {
        updateStatus('loading', 'Validating secure payment session...');
        const verifyRes = await fetch(`${API_BASE}/api/verify-session`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId })
        });

        if (!verifyRes.ok) {
          const errData = await verifyRes.json().catch(() => ({}));
          throw new Error(errData.error || 'Payment session has expired or is invalid.');
        }

        const verifyData = await verifyRes.json();
        const session = verifyData.session;

        document.getElementById('user-email').textContent = session.email || 'Authenticated User';
        document.getElementById('plan-name').textContent = session.planName || session.planId;
        document.getElementById('plan-price').textContent = "₹" + session.amount.toFixed(2);
        document.getElementById('details-box').style.display = 'block';

        updateStatus('loading', 'Initializing Razorpay Gateway...');
        const isSubscription = session.planId.includes('monthly') || session.planId.includes('annual');
        const orderEndpoint = isSubscription ? '/api/create-subscription' : '/api/create-order';

        const orderRes = await fetch(`${API_BASE}${orderEndpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, planId: session.planId })
        });

        if (!orderRes.ok) {
          const errText = await orderRes.text();
          throw new Error(errText || 'Failed to initialize payment gateway order');
        }

        const orderData = await orderRes.json();
        const orderId = orderData.subscriptionId || orderData.order_id || orderData.orderId;
        const razorpayKey = orderData.key_id || 'rzp_test_TEaZoQs4IIFazC';

        if (orderId && (orderId.startsWith('sub_mock_') || orderId.startsWith('order_mock_'))) {
          updateStatus('loading', 'Simulating payment confirmation...');
          await verifyPayment('pay_mock_' + Math.random().toString(36).substring(2, 14), orderId, 'sig_mock_xyz', session.planId);
          return;
        }

        const options = {
          key: razorpayKey,
          amount: isSubscription ? undefined : (session.amount * 100),
          currency: 'INR',
          name: "DayStack Workspace",
          description: session.planName,
          image: "https://daystack-mu.vercel.app/logo.png",
          order_id: isSubscription ? undefined : orderId,
          subscription_id: isSubscription ? orderId : undefined,
          prefill: {
            email: session.email
          },
          theme: {
            color: "#C5A059"
          },
          handler: function (response) {
            verifyPayment(
              response.razorpay_payment_id || response.razorpay_subscription_id,
              isSubscription ? response.razorpay_subscription_id : response.razorpay_order_id,
              response.razorpay_signature,
              session.planId
            );
          },
          modal: {
            ondismiss: function() {
              updateStatus('error', 'Payment cancelled. No charges were incurred.');
              showButtons("daystack://payment-failed", "Return to DayStack App");
            }
          }
        };

        const rzp = new Razorpay(options);
        rzp.open();
      } catch (err) {
        console.error("Checkout error:", err);
        updateStatus('error', err.message || 'Payment processing error.');
        showButtons("daystack://payment-failed", "Return to DayStack App");
      }
    }

    async function verifyPayment(paymentId, orderId, signature, planId) {
      updateStatus('loading', 'Verifying payment signature with server...');
      try {
        const verifyRes = await fetch(`${API_BASE}/api/verify-payment`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sessionId: sessionId,
            razorpay_payment_id: paymentId,
            razorpay_order_id: orderId,
            razorpay_signature: signature,
            planId: planId
          })
        });

        if (!verifyRes.ok) {
          const errText = await verifyRes.text();
          throw new Error(errText || 'Signature verification rejected by backend.');
        }

        const data = await verifyRes.json();
        if (data.success) {
          window.location.href = `${API_BASE}/payment-success?session=${encodeURIComponent(sessionId)}`;
        } else {
          throw new Error('Payment verification failed.');
        }
      } catch (e) {
        console.error("Verification error:", e);
        updateStatus('error', e.message || 'Signature verification failed.');
        showButtons("daystack://payment-failed", "Return to DayStack App");
      }
    }
  </script>
</body>
</html>
