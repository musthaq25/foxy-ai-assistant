<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DayStack | Secure Payment Gateway</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    :root {
      --bg: #0A0A0C;
      --surface: #121216;
      --border: rgba(255, 255, 255, 0.08);
      --primary: #C5A059;
      --primary-hover: #E2BC72;
      --text: #F4F4F6;
      --text-muted: #9A9AA6;
      --success: #10B981;
      --error: #EF4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      overflow-x: hidden;
    }

    /* Ambient Glow Backgrounds */
    .glow {
      position: absolute;
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, rgba(197, 160, 89, 0.12) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
    }

    .checkout-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      text-align: center;
      backdrop-filter: blur(16px);
    }

    .logo-container {
      margin-bottom: 24px;
    }

    .logo-img {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      padding: 10px;
    }

    h2 {
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 28px;
    }

    .details-box {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 28px;
      text-align: left;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 0.95rem;
    }

    .detail-row:last-child {
      margin-bottom: 0;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
    }

    .detail-label {
      color: var(--text-muted);
    }

    .detail-value {
      font-weight: 500;
    }

    .detail-value.price {
      color: var(--primary);
      font-size: 1.2rem;
      font-weight: 700;
    }

    /* Status and Loader animations */
    .status-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 20px 0;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(197, 160, 89, 0.15);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .status-icon {
      font-size: 54px;
      margin-bottom: 16px;
      display: none;
    }

    .status-text {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1.5;
    }

    .btn-action {
      display: inline-block;
      width: 100%;
      background: var(--primary);
      color: #000;
      border: none;
      border-radius: 14px;
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      margin-top: 16px;
    }

    .btn-action:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="checkout-card">
    <div class="logo-container">
      <img src="./logo.png" alt="DayStack Logo" class="logo-img" onerror="this.src='https://daystack-mu.vercel.app/logo.png'">
    </div>
    <h2 id="checkout-title">DayStack Payment</h2>
    <p class="subtitle" id="checkout-subtitle">Authenticating payment session...</p>

    <div class="details-box" id="details-box" style="display: none;">
      <div class="detail-row">
        <span class="detail-label">Account</span>
        <span class="detail-value" id="user-email">-</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Plan</span>
        <span class="detail-value" id="plan-name">-</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Amount</span>
        <span class="detail-value price" id="plan-price">-</span>
      </div>
    </div>

    <div class="status-container" id="status-container">
      <div class="spinner" id="spinner"></div>
      <p class="status-text" id="status-text">Connecting to secure servers...</p>
    </div>

    <div id="action-buttons" style="display: none;">
      <a href="daystack://payment-failed" class="btn-action" id="btn-redirect">Return to DayStack App</a>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('session');
    const pathname = window.location.pathname;

    function updateStatus(type, message) {
      const spinner = document.getElementById('spinner');
      const text = document.getElementById('status-text');
      
      if (type === 'loading') {
        spinner.style.display = 'block';
      } else {
        spinner.style.display = 'none';
        text.style.color = type === 'success' ? 'var(--success)' : 'var(--error)';
      }
      text.textContent = message;
    }

    function showButtons(schemeUrl, text = "Return to DayStack App") {
      document.getElementById('action-buttons').style.display = 'block';
      const btn = document.getElementById('btn-redirect');
      btn.href = schemeUrl;
      btn.textContent = text;
    }

    function triggerDeepLink(schemeUrl) {
      window.location.href = schemeUrl;
      setTimeout(() => {
        showButtons(schemeUrl, "Open DayStack App");
      }, 1500);
    }

    // Handle /payment-success route
    if (pathname.includes('payment-success')) {
      document.getElementById('checkout-title').textContent = "Payment Successful! 🎉";
      document.getElementById('checkout-subtitle').textContent = "Your DayStack Pro upgrade is active.";
      updateStatus('success', 'Redirecting back to DayStack App to unlock your premium features...');
      const successLink = sessionId ? `daystack://payment-success?session=${encodeURIComponent(sessionId)}` : 'daystack://payment-success';
      triggerDeepLink(successLink);
    } else {
      // Main /payment flow
      window.onload = startCheckoutFlow;
    }

    async function startCheckoutFlow() {
      if (!sessionId) {
        document.getElementById('checkout-title').textContent = "Payment Session Required";
        document.getElementById('checkout-subtitle').textContent = "Please initiate your upgrade directly from the DayStack App.";
        updateStatus('error', 'No valid session ID provided. Firebase ID tokens and price overrides are strictly prohibited in browser URLs.');
        showButtons("daystack://payment-failed", "Return to DayStack App");
        return;
      }

      try {
        // 1. Verify Session with Server (Server-Authoritative Price & Email)
        updateStatus('loading', 'Validating secure payment session...');
        const verifyRes = await fetch(`${API_BASE}/api/verify-session`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId })
        });

        if (!verifyRes.ok) {
          const errData = await verifyRes.json().catch(() => ({}));
          throw new Error(errData.error || 'Payment session has expired or is invalid.');
        }

        const verifyData = await verifyRes.json();
        const session = verifyData.session;

        // Display Server-Authoritative Details
        document.getElementById('user-email').textContent = session.email || 'Authenticated User';
        document.getElementById('plan-name').textContent = session.planName || session.planId;
        document.getElementById('plan-price').textContent = "₹" + session.amount.toFixed(2);
        document.getElementById('details-box').style.display = 'block';

        // 2. Request backend to create Razorpay Order/Subscription
        updateStatus('loading', 'Initializing Razorpay Checkout...');
        const isSubscription = session.planId.includes('monthly') || session.planId.includes('annual');
        const orderEndpoint = isSubscription ? '/api/create-subscription' : '/api/create-order';

        const orderRes = await fetch(`${API_BASE}${orderEndpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, planId: session.planId })
        });

        if (!orderRes.ok) {
          const errText = await orderRes.text();
          throw new Error(errText || 'Failed to initialize payment gateway order');
        }

        const orderData = await orderRes.json();
        const orderId = orderData.subscriptionId || orderData.order_id || orderData.orderId;
        const razorpayKey = orderData.key_id || 'rzp_test_TEaZoQs4IIFazC';

        // Simulated Mock Order handling (for dev/emulator)
        if (orderId && (orderId.startsWith('sub_mock_') || orderId.startsWith('order_mock_'))) {
          updateStatus('loading', 'Simulating payment confirmation...');
          await verifyPayment('pay_mock_' + Math.random().toString(36).substring(2, 14), orderId, 'sig_mock_xyz', session.planId);
          return;
        }

        // 3. Open Razorpay Standard Checkout Overlay
        const options = {
          key: razorpayKey,
          amount: isSubscription ? undefined : (session.amount * 100),
          currency: 'INR',
          name: "DayStack Workspace",
          description: session.planName,
          image: "https://daystack-mu.vercel.app/logo.png",
          order_id: isSubscription ? undefined : orderId,
          subscription_id: isSubscription ? orderId : undefined,
          prefill: {
            email: session.email
          },
          theme: {
            color: "#C5A059"
          },
          handler: function (response) {
            verifyPayment(
              response.razorpay_payment_id || response.razorpay_subscription_id,
              isSubscription ? response.razorpay_subscription_id : response.razorpay_order_id,
              response.razorpay_signature,
              session.planId
            );
          },
          modal: {
            ondismiss: function() {
              updateStatus('error', 'Payment cancelled. No charges were incurred.');
              showButtons("daystack://payment-failed", "Return to DayStack App");
            }
          }
        };

        const rzp = new Razorpay(options);
        rzp.open();
      } catch (err) {
        console.error("Checkout error:", err);
        updateStatus('error', err.message || 'Payment processing error.');
        showButtons("daystack://payment-failed", "Return to DayStack App");
      }
    }

    async function verifyPayment(paymentId, orderId, signature, planId) {
      updateStatus('loading', 'Verifying payment signature with server...');
      try {
        const verifyRes = await fetch(`${API_BASE}/api/verify-payment`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sessionId: sessionId,
            razorpay_payment_id: paymentId,
            razorpay_order_id: orderId,
            razorpay_signature: signature,
            planId: planId
          })
        });

        if (!verifyRes.ok) {
          const errText = await verifyRes.text();
          throw new Error(errText || 'Signature verification rejected by backend.');
        }

        const data = await verifyRes.json();
        if (data.success) {
          window.location.href = `${API_BASE}/payment-success?session=${encodeURIComponent(sessionId)}`;
        } else {
          throw new Error('Payment verification failed.');
        }
      } catch (e) {
        console.error("Verification error:", e);
        updateStatus('error', e.message || 'Signature verification failed.');
        showButtons("daystack://payment-failed", "Return to DayStack App");
      }
    }
  </script>
</body>
</html>
