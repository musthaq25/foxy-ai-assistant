<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Foxy AI Assistant - Nomix Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
            startup: { ready: function () { MathJax.startup.defaultReady(); } }
        };
    </script>
    <script async="" id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style id="custom-styles">
        /* --- UI PROFESSIONALISM FIXES & ANIMATIONS --- */
        
        :root {
            --glass-bg-default: rgba(17,24,39,0.7); 
            --glass-border-default: rgba(12, 74, 110, 0.3); 
            --ease-snappy: cubic-bezier(.2,.9,.3,1); 
            --accent-color: 6, 182, 212; 
            --liquid-overlay: rgba(var(--accent-color), 0.3); 
            --glass-bg: var(--glass-bg-default);
            --glass-border: var(--glass-border-default);
        }

        /* Base Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeAndScale { 
            0% { opacity: 0; transform: scale(0.98); } 
            100% { opacity: 1; transform: scale(1); } 
        }
        @keyframes slideInRight { 
            0% { opacity: 0; transform: translateX(12px); } 
            100% { opacity: 1; transform: translateX(0); } 
        }
        @keyframes orbPulse { 
            0%, 100% { transform: scale(1); box-shadow: 0 0 10px rgba(var(--accent-color), 0.4); } 
            50% { transform: scale(1.04); box-shadow: 0 0 25px rgba(var(--accent-color), 0.7); } 
        }
        @keyframes listeningPulse {
            /* Now pulses with a green/emerald glow when listening */
            0%, 100% { transform: scale(1.02); box-shadow: 0 0 10px #4ade80, 0 0 20px #4ade80; border-color: #4ade80; }
            50% { transform: scale(1.06); box-shadow: 0 0 20px #4ade80, 0 0 36px #4ade80; border-color: #10b981; }
        }
        @keyframes subtitleEffect {
            0% { opacity: 0; transform: translateY(8px) scale(.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes smoothFadeIn {
            /* Key for paragraph-by-paragraph animation */
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        /* --- Sidebar & Transition Fixes --- */
        #sidebar {
            /* Smooth transition for transform */
            transition: transform 350ms var(--ease-snappy), box-shadow 350ms var(--ease-snappy);
        }
        #main-content-area {
            /* Smooth transitions for the main content shift */
            transition: margin-left 350ms var(--ease-snappy);
        }
        /* Mobile fixes: main content doesn't need transform, sidebar is fixed */
        @media (min-width: 1024px) {
            .sidebar-shifted #main-content-area {
                margin-left: 288px; /* Correctly shifts main content on desktop */
                transform: none;
            }
        }
        
        /* Glass panel helpers */
        .glass-panel {
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02)); 
            background-color: var(--glass-bg);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 30px rgba(0,0,0,0.7); 
            backdrop-filter: blur(14px) saturate(150%); 
            -webkit-backdrop-filter: blur(14px) saturate(150%);
            border-radius: 16px;
            /* Using transform for hover effect provides better performance than other properties */
            transition: transform 220ms var(--ease-snappy), box-shadow 220ms var(--ease-snappy), background-color 220ms var(--ease-snappy);
        }
        .glass-panel:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 10px 40px rgba(var(--accent-color), 0.2), 0 0 1px rgba(var(--accent-color), 0.8);
        }
        
        /* Foxy Message Container (Improved Gapping & Styling) */
        .foxy-message-container {
            width: 100%;
            padding: 1.5rem 0; 
            margin: 0; 
            background-color: rgba(var(--accent-color), 0.05); 
            border-top: 1px solid rgba(var(--accent-color), 0.1);
            border-bottom: 1px solid rgba(var(--accent-color), 0.1);
            margin-bottom: 1px; 
            transition: background-color 300ms ease;
        }
        .foxy-message-content {
            max-width: 900px; /* ***FIX: Increased width for wider paragraphs*** */ 
            margin: 0 auto; 
            padding: 0 1.5rem; 
        }
        
        /* AI Response Fade-In (Paragraph by Paragraph) */
        .foxy-response-target > * { /* Target all top-level elements inside the response target */
             opacity: 0;
             animation: smoothFadeIn 0.8s var(--ease-snappy) forwards;
        }
        
        /* User Message Container (Improved Gapping) */
        .user-message-container {
            align-self: flex-end;
            max-width: 95%; /* ***FIX: Increased width for user messages*** */ 
            margin: 0.5rem 1.5rem 0.5rem 0; 
            word-wrap: break-word;
            animation: slideInRight 0.3s ease-in;
        }

        .user-message-content {
            background: linear-gradient(to right, rgba(var(--accent-color),0.8), rgba(var(--accent-color),0.9));
            color: black;
            padding: 0.75rem 1rem;
            border-radius: 1rem 1rem 0 1rem;
            box-shadow: 0 0 10px rgba(var(--accent-color),0.5);
            transition: box-shadow 300ms ease;
        }
        
        /* Loading Message Styling (Left-aligned, not center) */
        .loading-message-container {
             width: 100%;
             padding: 1.5rem 0;
             margin: 0; 
             background-color: rgba(var(--accent-color), 0.05); 
             border-top: 1px solid rgba(var(--accent-color), 0.1);
             border-bottom: 1px solid rgba(var(--accent-color), 0.1);
             margin-bottom: 1px; 
        }
        .loading-message-content {
             max-width: 800px;
             margin: 0 auto; 
             padding: 0 1.5rem; 
             display: flex;
             justify-content: flex-start; /* Foxy messages are left-aligned */
        }


        /* Scrollbar styles */
        #chat-messages-area::-webkit-scrollbar { width: 8px; }
        #chat-messages-area::-webkit-scrollbar-track { background: #0f1724; }
        #chat-messages-area::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 6px; }

        .send-button-active {
            box-shadow: 0 0 15px rgba(var(--accent-color), 0.8), 0 0 5px rgba(var(--accent-color), 1);
            background: linear-gradient(to bottom right, rgba(var(--accent-color), 1), rgba(var(--accent-color), 0.8));
            color: black !important;
        }
        
        /* Fix for code block overflow */
        pre { 
            white-space: pre-wrap; 
            word-break: break-all;
            padding: 1rem;
            background-color: rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow-x: auto;
        }
        
        /* Liquid Glass Theme Overrides */
        .theme-liquid-glass {
            background: radial-gradient(circle at 10% 10%, var(--liquid-overlay) 0%, transparent 60%),
                        radial-gradient(circle at 90% 90%, var(--liquid-overlay) 0%, transparent 60%),
                        linear-gradient(135deg, #0a1122 0%, #00040f 100%);
            background-size: 200% 200%;
            animation: moveGradient 10s ease-in-out infinite alternate;
        }
    </style>
    <link href='foxy.png' rel="icon" type="image/png"/>
</head>
<body class="bg-black text-white font-sans">
    <div class="h-screen w-full bg-black flex" id="app-root">
        </div>
    <script>
        // --- CRITICAL FIX 1: Robust Polyfill for crypto.randomUUID() ---
        if (typeof crypto === 'undefined' || typeof crypto.randomUUID !== 'function') {
            window.crypto = window.crypto || {};
            window.crypto.randomUUID = () => {
                const id = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                    const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                });
                return id;
            };
        }
        
        // --- THEME CONSTANTS ---
        const THEMES = {
            DARK: 'dark',
            GLASSMORPHISM: 'glassmorphism'
        };

        const ACCENT_COLORS = {
            CYAN: '6, 182, 212', 
            PINK: '236, 72, 153',
            EMERALD: '16, 185, 129',
            INDIGO: '99, 102, 241',
            ORANGE: '249, 115, 22'
        };

        // --- SPEECH API IMPLEMENTATION (TTS & STT) ---
        
        const SPEECH_RATE_SPEED = 1.0; 
        let recognition = null; 
        let isSpeaking = false;
        let recognitionActive = false;
        let recognitionStoppedForProcessing = false; 
        let isSTTActive = false; 
        let ttsVoicesLoaded = false;
        
        /** Ensures TTS voices are loaded. */
        const loadTTSVoices = () => {
            if (ttsVoicesLoaded) return;
            const voices = window.speechSynthesis.getVoices();
            if (voices.length > 0) {
                ttsVoicesLoaded = true;
                console.log("TTS voices loaded.");
            }
        };

        /** Initialize Web Speech API components. */
        const initSpeechAPI = () => {
            if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = 'en-US';
                setupRecognitionHandlers();
                console.log("Speech Recognition Initialized.");
            } else {
                console.warn("Speech Recognition not supported in this browser.");
            }
            
            if (window.speechSynthesis) {
                window.speechSynthesis.onvoiceschanged = loadTTSVoices;
                loadTTSVoices(); // Try loading immediately
            }
        };

        const hasSpeechAPI = () => {
             return ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) && (window.speechSynthesis && ttsVoicesLoaded);
        }

        const stopSpeech = () => { 
            if (window.speechSynthesis) {
                 window.speechSynthesis.cancel();
            }
            isSpeaking = false;
            updateOrbVisuals();
        };

        const speak = (text) => { 
            // TTS ONLY ENABLED FOR JARVIS MODE
            if (currentScreen !== SCREENS.JARVIS_MODE || !window.speechSynthesis || isSpeaking) return;
            
            // Clean up text for speech (only replace the markdown syntax, not the placeholder)
            const cleanedText = text
                                    .replace(/(\*\*|__|#)/g, '')
                                    .replace(/`/g, '')
                                    .replace(/\[userName\]/g, userName || 'Guest');
                                    
            if (!cleanedText.trim()) {
                 console.warn("Attempted to speak empty text.");
                 // Immediately release processing lock if there's nothing to say
                 isSpeaking = false; 
                 setUIProcessingState(false);
                 updateOrbVisuals();
                 if (currentScreen === SCREENS.JARVIS_MODE && !isProcessing) {
                    toggleJarvisListening(true);
                 }
                 return;
            }

            const utterance = new SpeechSynthesisUtterance(cleanedText);
            utterance.rate = SPEECH_RATE_SPEED;
            
            // Find the best voice: local en-US, then any en-US, then any voice
            const voices = window.speechSynthesis.getVoices();
            utterance.voice = voices.find(v => v.lang === 'en-US' && v.localService) || 
                              voices.find(v => v.lang === 'en-US') || 
                              voices[0] || 
                              null;
                              
            if (!utterance.voice) {
                 console.warn("No suitable TTS voice found. Speech will not be delivered.");
                 isSpeaking = false; 
                 setUIProcessingState(false); 
                 updateOrbVisuals();
                 if (currentScreen === SCREENS.JARVIS_MODE && !isProcessing) {
                     toggleJarvisListening(true);
                 }
                 return;
            }
            
            utterance.onstart = () => { isSpeaking = true; updateOrbVisuals(); };
            utterance.onend = () => { 
                isSpeaking = false; 
                setUIProcessingState(false); 
                updateOrbVisuals();
                // If in Jarvis mode, resume listening after speaking
                if (currentScreen === SCREENS.JARVIS_MODE && !isProcessing) {
                     toggleJarvisListening(true);
                }
            };
            utterance.onerror = (event) => {
                console.error("Speech Synthesis Error:", event.error);
                isSpeaking = false;
                setUIProcessingState(false);
                updateOrbVisuals();
                if (currentScreen === SCREENS.JARVIS_MODE && !isProcessing) {
                     toggleJarvisListening(true);
                }
            };
            
            window.speechSynthesis.speak(utterance);
        };
        
        const setupRecognitionHandlers = () => {
            if (!recognition) return;

            recognition.onresult = (event) => {
                if (recognitionStoppedForProcessing) return; 

                const result = event.results[0][0].transcript;
                recognitionStoppedForProcessing = true; // Stop processing new results

                if (currentScreen === SCREENS.JARVIS_MODE) {
                    animateSubtitle(`Command Received: "${result}"`);
                    sendMessage(result); 
                } else if (currentScreen === SCREENS.CHAT_MODE) {
                    const input = document.getElementById('chat-input');
                    if (input) {
                        input.value = result;
                        handleInputKey({key: 'input', target: input});
                    }
                    toggleSTT(); // Stop the mic
                }
            };

            recognition.onend = () => {
                recognitionActive = false;
                isSTTActive = false;
                updateOrbVisuals();
                if (currentScreen === SCREENS.JARVIS_MODE && !recognitionStoppedForProcessing && !isSpeaking && !isProcessing) {
                    // Auto-restart listening in Jarvis mode
                    toggleJarvisListening(true);
                }
                recognitionStoppedForProcessing = false;
            };

            recognition.onerror = (event) => {
                console.error('Recognition error:', event.error);
                animateSubtitle(`Voice Error: ${event.error}. Try again.`);
                recognitionActive = false;
                isSTTActive = false;
                updateOrbVisuals();
                recognitionStoppedForProcessing = false;
                // If error, attempt to restart in Jarvis mode
                if (currentScreen === SCREENS.JARVIS_MODE && !isProcessing && event.error !== 'not-allowed') {
                     setTimeout(() => toggleJarvisListening(true), 1000);
                }
            };
        };
        
        /** Toggles the listening state in Jarvis Mode */
        const toggleJarvisListening = (shouldListen) => {
            if (!hasSpeechAPI()) {
                 animateSubtitle("Voice or TTS not supported or permission denied.");
                 return;
            }
            
            if (shouldListen && !recognitionActive && !isProcessing) {
                stopSpeech(); // Ensure no current speech
                try {
                    recognition.start();
                    recognitionActive = true;
                    isSTTActive = true;
                    animateSubtitle("Listening for command...");
                    updateOrbVisuals();
                } catch (e) {
                    console.warn("Recognition start error:", e.message);
                    recognitionActive = false;
                    isSTTActive = false;
                    animateSubtitle("Start failed. Check mic permission.");
                }
            } else if (!shouldListen && recognitionActive) {
                recognition.stop();
                recognitionActive = false;
                isSTTActive = false;
                animateSubtitle("Stopped listening.");
                updateOrbVisuals();
            } else if (isProcessing || isSpeaking) {
                 animateSubtitle(isSpeaking ? "Speaking, please wait." : "Processing, please wait.");
            }
        };

        const toggleSTT = () => { 
            if (!hasSpeechAPI()) {
                 alert("Speech Recognition not supported in your browser or device.");
                 return;
            }
            if (isSTTActive) {
                recognition.stop();
            } else if (!isProcessing) {
                try {
                    recognition.start();
                    isSTTActive = true;
                    animateSubtitle("Mic active in Chat Mode. Speak now.");
                } catch(e) {
                     console.error("STT Start Error:", e);
                     alert("Could not start voice input. Check mic permissions.");
                }
            }
            updateOrbVisuals(); 
        };
        
        /** Updates the Jarvis Orb and Chat Mic Button visuals (Crucial for TTS/STT feedback) */
        const updateOrbVisuals = () => {
            const orb = document.getElementById('jarvis-orb');
            const icon = document.getElementById('jarvis-icon');
            const title = document.getElementById('jarvis-title-status');
            const micButton = document.getElementById('stt-mic-button');

            // 1. Jarvis Orb Status
            if (orb && icon && title) {
                orb.classList.remove('animate-listeningPulse', 'bg-emerald-600/70', 'animate-orbPulse', 'bg-gray-700/70');
                orb.classList.add('transition-all', 'duration-300');
                
                if (isSpeaking) {
                    orb.classList.add('animate-orbPulse', `bg-[rgba(${accentColor},0.5)]`); // Use accent color for speaking pulse
                    icon.innerHTML = `<svg class="w-16 h-16 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-4H7V9h4V5l5 6-5 6z"/></svg>`;
                    title.textContent = "Jarvis Mode: Speaking...";
                } else if (isSTTActive) {
                    orb.classList.add('animate-listeningPulse', 'bg-emerald-600/70');
                    icon.innerHTML = `<svg class="w-16 h-16 text-black" fill="currentColor" viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3.93-3 7-5.3 7S6.7 14.93 6.7 11H5c0 4.19 3.33 7.6 7 8v3h2v-3c3.67-.4 7-3.81 7-8h-1.7z"/></svg>`;
                    title.textContent = "Jarvis Mode: Listening for Command";
                } else if (isProcessing) {
                    orb.classList.add('animate-orbPulse', 'bg-gray-700/70');
                    icon.innerHTML = `<svg class="w-16 h-16 text-white animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.341 19l2.481-2.481m11.38-1.517l-2.482 2.481A8.001 8.001 0 004.341 4h-2.828"></path></svg>`;
                    title.textContent = "Jarvis Mode: Processing Request...";
                } else {
                     orb.classList.add('bg-gray-700/70');
                     icon.innerHTML = `<svg class="w-16 h-16 text-cyan-400" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-4H7V9h4V5l5 6-5 6z"/></svg>`;
                     title.textContent = "Jarvis Mode: Ready";
                     animateSubtitle("Tap the orb or speak a command.");
                }
            }
            
            // 2. Chat Mic Button Status
            if (micButton) {
                micButton.disabled = isProcessing || !hasSpeechAPI();
                micButton.classList.toggle('opacity-50', isProcessing || !hasSpeechAPI());
                micButton.classList.toggle('cursor-not-allowed', isProcessing || !hasSpeechAPI());
                micButton.classList.remove('text-red-500', 'text-emerald-500', 'animate-pulse');
                
                if (isSTTActive && currentScreen === SCREENS.CHAT_MODE) {
                    micButton.classList.add('text-emerald-500', 'animate-pulse');
                    micButton.title = 'Listening... Tap to Stop';
                } else {
                    micButton.classList.add('text-gray-400', 'hover:text-white');
                    micButton.title = hasSpeechAPI() ? 'Start Voice Input' : 'Voice Input Not Supported';
                }
            }
        };
        // --- End of Speech API Implementation ---


        // --- Local Storage Keys ---
        const STORAGE_KEY_USERNAME = 'foxy_user_name';
        const STORAGE_KEY_CHATHISTORY = 'foxy_chat_sessions';
        const STORAGE_KEY_THEME = 'foxy_theme';
        const STORAGE_KEY_ACCENT = 'foxy_accent_color';
        const STORAGE_KEY_LAST_SCREEN = 'foxy_last_screen'; 

        // --- Core Application State and Router ---
        
        const SCREENS = {
            LOADING: 'loading',
            ONBOARDING_NAME: 'onboarding_name', 
            WELCOME: 'welcome', 
            MODE_SELECTION: 'mode_selection',
            JARVIS_MODE: 'jarvis_mode',
            CHAT_MODE: 'chat_mode',
            SETTINGS: 'settings', 
        };
        
        let currentScreen = SCREENS.LOADING;
        let userId = 'local-storage-user'; 
        let userName = null; 
        let theme = THEMES.DARK; 
        let accentColor = ACCENT_COLORS.CYAN; 
        let isSidebarOpen = window.innerWidth >= 1024; // <-- FIX APPLIED HERE: Sidebar is open by default on desktop (>= 1024px)
        let isJarvisListening = false;
        let jarvisSubtitle = ""; 
        let isHistoryOpen = true; 
        let isProcessing = false; 
        let isInputDirty = false; 
        let isAnimatingResponse = false; 
        let lastNonSettingsScreen = SCREENS.WELCOME;

        // Load all chat sessions
        let allSessions = [];
        let currentSessionId = null;
        
        /** Sets the current screen and manages transitions */
        const setScreen = (newScreen) => {
            if (currentScreen === newScreen) return;

            const previousScreen = currentScreen;
            currentScreen = newScreen;

            // Store last non-settings screen
            if (newScreen !== SCREENS.SETTINGS && newScreen !== SCREENS.LOADING && newScreen !== SCREENS.ONBOARDING_NAME) {
                 lastNonSettingsScreen = newScreen;
                 try { localStorage.setItem(STORAGE_KEY_LAST_SCREEN, newScreen); } catch(e) { /* ignore */ }
            }

            // Cleanup when leaving speech-active screens
            if (previousScreen === SCREENS.JARVIS_MODE || previousScreen === SCREENS.CHAT_MODE) {
                stopSpeech();
                toggleJarvisListening(false);
            }
            
            updateScreen();
        }; 
        
        /** Loads user data from local storage. */
        const loadPersistentData = () => {
            try {
                userName = localStorage.getItem(STORAGE_KEY_USERNAME);
                const storedTheme = localStorage.getItem(STORAGE_KEY_THEME);
                if (storedTheme) theme = storedTheme;
                const storedAccent = localStorage.getItem(STORAGE_KEY_ACCENT);
                if (storedAccent) accentColor = storedAccent;
                const storedLastScreen = localStorage.getItem(STORAGE_KEY_LAST_SCREEN);
                if (storedLastScreen) lastNonSettingsScreen = storedLastScreen;
            } catch (e) {
                console.error("Failed to load data from localStorage:", e);
            }
        };

        /** Saves the user's name to local storage. */
        const saveUserName = (name) => {
            userName = name;
            try {
                if (name === null) {
                    localStorage.removeItem(STORAGE_KEY_USERNAME);
                } else {
                    localStorage.setItem(STORAGE_KEY_USERNAME, name);
                }
            } catch (e) {
                console.error("Failed to save data to localStorage:", e);
            }
        };
        
        /** Handles the submission of the user's name. */
        const handleNameSubmission = () => {
            const input = document.getElementById('name-input');
            const name = input.value.trim();
            if (name.length > 0) {
                saveUserName(name);
                handleModeSelection(SCREENS.WELCOME); 
            } else {
                alert("Please enter your name.");
            }
        };

        // --- MODE SELECTION FIX ---

        /** Handler for the Mode Selection buttons. */
        const handleModeSelection = (mode) => {
            stopSpeech(); 
            
            if (mode === SCREENS.CHAT_MODE) {
                const currentSession = getCurrentSession();
                if (!currentSession || currentSession.mode !== 'chat') {
                    startNewSession('chat');
                }
                setScreen(SCREENS.CHAT_MODE);
            } else if (mode === SCREENS.JARVIS_MODE) {
                const currentSession = getCurrentSession();
                 if (!currentSession || currentSession.mode !== 'jarvis') {
                    startNewSession('jarvis');
                }
                setScreen(SCREENS.JARVIS_MODE);
                // Ensure TTS is loaded before starting listen
                if (ttsVoicesLoaded) {
                    setTimeout(() => toggleJarvisListening(true), 500); 
                }
            } else if (mode === SCREENS.MODE_SELECTION) {
                setScreen(SCREENS.MODE_SELECTION);
            } else if (mode === SCREENS.WELCOME) {
                setScreen(SCREENS.WELCOME);
            }
            toggleSidebar(false); 
        };
        
        // --- THEME MANAGEMENT ---
        const applyTheme = () => {
            const body = document.body;
            body.classList.remove('bg-black', 'theme-liquid-glass'); 

            document.documentElement.style.setProperty('--accent-color', accentColor);

            if (theme === THEMES.GLASSMORPHISM) {
                body.classList.add('theme-liquid-glass'); 
                document.documentElement.style.setProperty('--glass-bg', `rgba(${accentColor}, 0.08)`);
                document.documentElement.style.setProperty('--glass-border', `rgba(${accentColor}, 0.4)`);
            } else {
                body.classList.add('bg-black');
                document.documentElement.style.setProperty('--glass-bg', 'var(--glass-bg-default)');
                document.documentElement.style.setProperty('--glass-border', 'var(--glass-border-default)');
            }
        };

        const setTheme = (newTheme) => {

        // --- NEW: ANDROID COMMAND HANDLING (FIXED) ---
        /** Opens an Android App via Intent URI in a web browser, compatible with Android. */
        const handleAndroidAppCommand = (appName, command) => {
            let uri = '';
            appName = appName ? appName.toLowerCase() : 'unknown';
            command = command ? command.toLowerCase() : '';
            
            // Simple mapping for common app commands in an Android browser
            if (appName.includes('calculator')) {
                // Calculator (using a common package name)
                uri = 'intent://#Intent;package=com.android.calculator2;end'; 
            } else if (appName.includes('weather')) {
                 // Weather app (highly variable, using a general search as fallback)
                uri = `intent:q=${encodeURIComponent('weather')}/#Intent;action=android.intent.action.WEB_SEARCH;end`; 
            } else if (appName.includes('call') || appName.includes('dialer')) {
                 // Dialer with extracted number (using tel: scheme)
                const number = command.match(/\d+/g)?.join('');
                if (number) uri = `tel:${number}`;
            } else if (appName.includes('settings')) {
                 // Android Settings
                 uri = 'intent:#Intent;action=android.settings.SETTINGS;end';
            } else if (appName.includes('youtube')) {
                 // YouTube with search (example)
                const query = command.replace(/open youtube to search/i, '').trim() || 'trending videos';
                uri = `intent:q=${encodeURIComponent(query)}/#Intent;scheme=vnd.youtube;action=android.intent.action.SEARCH;end`;
            } else {
                // ***FIX: Robust Fallback for Android App Commands***
                // If no specific app is mapped, try a Play Store search as a helpful action.
                const searchName = command.replace(/open /i, '').replace(/app/i, '').trim() || appName;
                if (searchName && searchName !== 'unknown') {
                    uri = `market://search?q=${encodeURIComponent(searchName)}`;
                    animateSubtitle(`Attempting Play Store search for: ${searchName}...`);
                } else {
                    console.warn(`No specific URI mapping for app: ${appName}`);
                    alert(`Foxy simulated command execution for: ${appName} - ${command}. App command not supported.`);
                    return;
                }
            }

            console.log(`Attempting to execute URI: ${uri}`);
            animateSubtitle(`Attempting to launch ${appName}...`);
            
            // Execute the intent URI via location change
            setTimeout(() => {
                 window.location.href = uri;
            }, 100);
        };

        // --- SECURE AI API CALL FUNCTION ---
        
        const NETLIFY_AI_PROXY_URL = '/.netlify/functions/foxy-ai-proxy'; 

        /** Fetches AI response from the secure Netlify Function proxy. */
        const fetchAIResponse = async (sessionId, userMessage, isFirstMessage = false, mode = 'chat', maxRetries = 3) => {
            
            const endpoint = NETLIFY_AI_PROXY_URL; 
            const currentSession = allSessions.find(s => s.id === sessionId);
            
            // 1. Build cleaned history
            // Filter out transient messages (like 'Foxy is thinking...') and map to the required API format.
            const cleanedHistory = currentSession.messages
                .filter(m => !m.isLoading && m.text && m.text.length > 0) 
                .slice(-20) // Keep the last 20 messages for context (Enables persistent memory)
                .map(m => ({ 
                    role: m.sender === 'foxy' ? 'assistant' : 'user', 
                    // Replace placeholder in history content for better model consistency
                    content: m.text.replace(/\[userName\]/g, userName || 'Guest') 
                }));
                
            // 2. Build system instruction
            let systemInstructionContent = `You are Foxy AI Assistant. The user's name is ${userName || 'Guest'}. When you need to refer to the user by name in your response, use the placeholder **[userName]**. Keep your responses concise and helpful. If the user asks about who created you, respond with: "I was created by **Nomix**, a dedicated developer team. The CEO of Nomix is **Mohammed Musthaq**."`;
            
            if (mode === SCREENS.JARVIS_MODE) {
                systemInstructionContent += `\n\nCRITICAL: You are in Jarvis Command mode. **All your responses MUST be valid JSON objects** with the following structure: \`{"tts_response": "Your spoken response here (max 50 words).", "display_text": "Formatted text for the chat history (markdown is allowed).", "command": "optional_command_identifier", "app_name": "App name here"}\`. Only return the raw JSON object, no markdown or extra text outside the JSON.`;
            }

            const systemInstruction = {
                role: 'system',
                content: systemInstructionContent
            };

            // 3. Add system instruction to the beginning of the history
            cleanedHistory.unshift(systemInstruction);

            const payload = {
                session_id: sessionId,
                query: userMessage, 
                is_first_message: isFirstMessage, 
                mode: mode, 
                history: cleanedHistory, // Use the context-rich, cleaned history
                user_name: userName || 'Guest'
            };

            const baseDelay = 700; 
            for (let attempt = 0; attempt <= maxRetries; attempt++) {
                try {
                    const resp = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (resp.status === 429 || (resp.status >= 500 && resp.status < 600)) {
                        const retryAfter = resp.headers.get('Retry-After');
                        const wait = retryAfter ? parseFloat(retryAfter) * 1000 : baseDelay * Math.pow(2, attempt);
                        if (attempt < maxRetries) {
                            await new Promise(r => setTimeout(r, wait + Math.random() * 300));
                            continue;
                        } else {
                            return { text: `Foxy is busy (server returned ${resp.status}). Please wait a moment and try again.`, isCommand: false };
                        }
                    }

                    if (!resp.ok) {
                        let errorText = `HTTP error ${resp.status}`;
                        try {
                            const errorData = await resp.json();
                            errorText = errorData.error || errorText;
                        } catch (e) {
                            errorText = await resp.text().catch(() => errorText);
                        }
                        return { text: `Server error: ${errorText}`, isCommand: false };
                    }

                    const data = await resp.json();
                    return { text: data.text, isCommand: data.is_command, generatedTitle: data.generated_title || null, command: data.command || null, appName: data.app_name || null, greeting: data.greeting || null };

                } catch (error) {
                    console.error('AI Fetch Error:', error);
                    const wait = baseDelay * Math.pow(2, attempt);
                    if (attempt < maxRetries) {
                        await new Promise(r => setTimeout(r, wait + Math.random() * 300));
                        continue;
                    } else {
                        return { text: 'An unknown network error occurred. Please check your connection and try again.', isCommand: false };
                    }
                }
            }
        };

        /** Loads all chat sessions from local storage. */
        function loadSessions() {

        // --- MARKDOWN RENDERING UTILITY ---

        /** Converts a subset of markdown to HTML. */
        const parseMarkdown = (markdown) => {
            let html = markdown || '';

            // Handle [userName] placeholder
            html = html.replace(/\[userName\]/g, userName || 'Guest');

            // Escape HTML characters first to protect against script injection in markdown
            html = html.replace(/&/g, '&amp;')
                       .replace(/</g, '&lt;')
                       .replace(/>/g, '&gt;')
                       .replace(/"/g, '&quot;')
                       .replace(/'/g, '&#039;');
            
            // Bold (**text** or __text__)
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                       .replace(/__(.*?)__/g, '<strong>$1</strong>');
            
            // Italics (*text* or _text_)
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>')
                       .replace(/_(.*?)_/g, '<em>$1</em>');
                       
            // Headers (## Header) -> only H3 supported in this simplified parser
            html = html.replace(/### (.*?)\n/g, '<h3>$1</h3>')
                       .replace(/## (.*?)\n/g, '<h2>$1</h2>')
                       .replace(/# (.*?)\n/g, '<h1>$1</h1>');
            
            // Lists (simple * or - lists) - requires a bit more logic or reliance on innerHTML parsing later).
            // For now, simple list item tags are OK.
            
            // Code Blocks (```)
            html = html.replace(/```(.*?)\n([\s\S]*?)```/g, (match, language, code) => {
                const lang = language.trim().toLowerCase() || 'text';
                const codeHtml = code.trim().replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#039;/g, "'"); // Unescape for code blocks only
                return `<pre class="text-sm overflow-x-auto"><code class="language-${lang}">${codeHtml}</code></pre>`;
            });
            
            // Convert remaining double newlines to paragraphs/breaks
            html = `<p>${html.split(/(\r\n|\r|\n){2,}/g).filter(s => s.trim().length > 0).join('</p><p>')}</p>`;
            
            // Remove empty paragraph tags that might have been created
            html = html.replace(/<p><\/p>/g, '');

            return html;

                        <span class="truncate">${session.title}</span>

        };

        /** Renders a simple loading screen (should only appear briefly on initial load). */
        const renderLoadingScreen = () => {
            return `
                <div class="flex flex-col items-center justify-center flex-grow p-6 h-full animate-fadeIn">
                    <img src="foxy.png" alt="Foxy Logo" class="w-24 h-24 mx-auto mb-4 animate-pulse"/>
                    <h1 class="text-3xl font-bold text-cyan-400 mb-2">Loading Foxy AI...</h1>
                    <p class="text-gray-400">Please wait.</p>
                </div>
            `;
        };
        
        /** The main function to update and re-render the entire application state. */
        const updateScreen = () => {
            const root = document.getElementById('app-root');
            if (!root) return;
            
            // 1. Render Sidebar and Main Content
            root.innerHTML = renderSidebar() + renderMainContent();
            
            // 2. Re-render dynamic elements
            renderSessionHistory();
            
            // 3. Update Jarvis/Chat specific visuals (if on those screens)
            if (currentScreen === SCREENS.CHAT_MODE || currentScreen === SCREENS.JARVIS_MODE) {
                renderChatMessages();
                updateOrbVisuals(); // Re-initializes Jarvis Orb/Mic Button state
            }
            
            // 4. Update Input State (if Input exists)
            updateInputActiveState();

            // 5. Ensure visibility state is correct after DOM update
            updateHistoryVisibility(); 
        };

        /** Initializes the application state and renders the first screen. */
        const initializeApp = () => {
            loadPersistentData();
            loadSessions();
            initSpeechAPI(); 
            applyTheme();

            if (!userName) {
                setScreen(SCREENS.ONBOARDING_NAME);
            } else if (currentScreen === SCREENS.LOADING) {
                 // Determine initial screen based on last non-settings screen
                 if (lastNonSettingsScreen === SCREENS.JARVIS_MODE) {
                     setScreen(SCREENS.JARVIS_MODE);
                 } else if (lastNonSettingsScreen === SCREENS.CHAT_MODE) {
                     setScreen(SCREENS.CHAT_MODE);
                 } else {
                     setScreen(SCREENS.WELCOME);
                 }
            } else {
                updateScreen();
            }
        };
        
        // This ensures the DOM is ready before we start manipulating it
        document.addEventListener('DOMContentLoaded', initializeApp);
    </script>
</body>
</html>
